name: darzi_dairy
description: "Tailor Master (Darzi Diary) - Standalone Offline Khata & Workshop Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # State Management
  provider: ^6.1.2

  # Declarative Routing
  go_router: ^14.2.0

  # Offline Local Database (temporarily commented out for UI preview)
  # isar: ^3.1.0+1
  # isar_flutter_libs: ^3.1.0+1

  # Device & Storage Utilities
  path_provider: ^2.1.4

  # Formatting, Locales & UUIDs
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.9
  # isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
